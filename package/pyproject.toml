[project]
name = "solie"
version = "9.3.4"
description = "GUI trading bot designed for targeting the futures markets of Binance"
authors = [{ name = "Cunarist", email = "cunarist@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiosqlite~=0.21.0",
    "numpy~=2.2.6",
    "polars~=1.35.2",
    "scipy~=1.16.3",
    "pyside6~=6.8.2",
    "pyqtgraph~=0.13.7",
    "aiohttp~=3.9.3",
    "faust-cchardet~=2.1.19",
    "aiodns~=3.1.1",
    "aiofiles~=23.2.1",
    "aioshutil~=1.6",
    "apscheduler~=3.10.4",
    "pygments~=2.17.1",
    "yapf~=0.32.0",
    "getmac~=0.8.3",
    "time-machine~=2.13.0",
    "xdialog~=1.1.1",
    "setuptools~=75.6.0",
    "pydantic~=2.10.6",
    "yoyo-migrations~=9.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
solie = ["migrations/**/*.sql"]
